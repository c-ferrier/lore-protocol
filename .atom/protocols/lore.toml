name = "Lore"
version = "1.0"
namespace = ""
identity_key = "Lore-id"

[trailers.Lore-id]
description = "Stable atom identity."
multivalue = false
validation = "pattern"
pattern = "^[0-9a-f]{8}$"
generator = "hex8"
required = true
isCore = true
directives = [ "[on:amend] Preserve the existing ID to maintain graph integrity", "[on:commit] Handled by Lore CLI; MUST NOT manually generate IDs or use git hashes", "[on:commit] The CLI automatically assigns a random 8-character hex string" ]

[trailers.Lore-id.ui]
kind = "identity"
color = "dim"

[trailers.Lore-id.prompt]
order = 0

[trailers.Constraint]
description = "Rules that shaped this decision and may still be active."
multivalue = true
validation = "none"
isCore = true
directives = [ "[on:commit] Obey all active constraints. Violations are bugs unless explicitly superseded.", "[on:squash] Carry forward only those that apply to the final state" ]

[trailers.Constraint.ui]
kind = "decision"
color = "cyan"

[trailers.Constraint.cli]
flag = "constraint"

[trailers.Constraint.prompt]
confirm = "Add a Constraint?"
input = "Constraint:"
order = 100

[trailers.Rejected]
description = "Alternatives evaluated and dismissed."
multivalue = true
validation = "pattern"
pattern = "^.+ \\| .+$"
isCore = true
directives = [ "[on:squash] Record all failed starts or intermediate pivots here" ]

[trailers.Rejected.ui]
kind = "decision"
color = "magenta"

[trailers.Rejected.cli]
flag = "rejected"

[trailers.Rejected.prompt]
confirm = "Add a Rejected alternative?"
input = "Rejected (format: alternative | reason):"
order = 110

[trailers.Confidence]
description = "Author’s assessment of the decision's correctness."
multivalue = false
validation = "values"
isCore = true
squash = "rank-min"
directives = [ "[on:squash] Take the most conservative value (e.g., low + high = low)" ]

[trailers.Confidence.values.low]
description = "Hypothesis/first attempt; no verification."

[trailers.Confidence.values.medium]
description = "Locally verified or based on docs."

[trailers.Confidence.values.high]
description = "Thoroughly tested (CI/staging) or extensive domain knowledge."

[trailers.Confidence.ui]
kind = "risk"
color = "cyan"

[trailers.Confidence.cli]
flag = "confidence"

[trailers.Confidence.prompt]
confirm = "Set Confidence?"
choice = "Confidence:"
order = 120

[trailers.Confidence.stale_if]
kind = "value-equals"
value = "low"
signal = "low-confidence"

[trailers.Scope-risk]
description = "The \"blast radius\" of the change."
multivalue = false
validation = "values"
isCore = true
squash = "rank-max"
directives = [ "[on:squash] Take the most conservative value (e.g., narrow + wide = wide)" ]

[trailers.Scope-risk.values.narrow]
description = "Isolated to a single function/file; no external callers."

[trailers.Scope-risk.values.moderate]
description = "Affects a module; bounded/enumerable radius."

[trailers.Scope-risk.values.wide]
description = "Affects cross-cutting concerns, public APIs, or schemas."

[trailers.Scope-risk.ui]
kind = "risk"
color = "cyan"

[trailers.Scope-risk.cli]
flag = "scope-risk"

[trailers.Scope-risk.prompt]
confirm = "Set Scope-risk?"
choice = "Scope-risk:"
order = 130

[trailers.Reversibility]
description = "Ease of undoing the change."
multivalue = false
validation = "values"
isCore = true
squash = "rank-max"
directives = [ "[on:modify] If \"irreversible\", seek explicit approval before proceeding", "[on:squash] Take the most conservative value (e.g., clean + irreversible = irreversible)" ]

[trailers.Reversibility.values.clean]
description = "Revertible via git revert with no side effects."

[trailers.Reversibility.values.migration-needed]
description = "Requires data migration or infra updates."

[trailers.Reversibility.values.irreversible]
description = "Cannot be fully undone (e.g., data deletion)."

[trailers.Reversibility.ui]
kind = "risk"
color = "cyan"

[trailers.Reversibility.cli]
flag = "reversibility"

[trailers.Reversibility.prompt]
confirm = "Set Reversibility?"
choice = "Reversibility:"
order = 140

[trailers.Directive]
description = "Forward-looking instructions for future modifiers."
multivalue = true
validation = "none"
isCore = true
directives = [ "[on:commit] Use [until:...] prefix for temporary rules that expire", "[on:squash] Carry forward until fulfilled, rejected, or condition met", "[on:stale][until:YYYY-MM-DD] Flag as stale if hint is expired" ]

[trailers.Directive.ui]
kind = "decision"
color = "yellow"

[trailers.Directive.cli]
flag = "directive"

[trailers.Directive.prompt]
confirm = "Add a Directive?"
input = "Directive:"
order = 150

[trailers.Directive.stale_if]
kind = "date-expired"
signal = "expired-hint"

[trailers.Tested]
description = "What was verified and how."
multivalue = true
validation = "none"
isCore = true
directives = [ "[on:squash] Consolidate evidence into 3-4 high-signal summary statements" ]

[trailers.Tested.ui]
kind = "evidence"
color = "green"

[trailers.Tested.cli]
flag = "tested"

[trailers.Tested.prompt]
confirm = "Add a Tested entry?"
input = "Tested:"
order = 160

[trailers.Not-tested]
description = "What was not verified and why."
multivalue = true
validation = "none"
isCore = true

[trailers.Not-tested.ui]
kind = "evidence"
color = "red"

[trailers.Not-tested.cli]
flag = "not-tested"

[trailers.Not-tested.prompt]
confirm = "Add a Not-tested entry?"
input = "Not-tested:"
order = 170

[trailers.Supersedes]
description = "Lore-id of the atom this decision replaces."
multivalue = true
validation = "reference"
crossProtocol = true
isCore = true
directives = [ "[on:commit] Only for replacements. Use \"Related\" or \"Depends-on\" for additive context.", "[on:squash] Remove IDs that only exist in local-only (squashed) commits" ]

[trailers.Supersedes.ui]
kind = "reference"
color = "dim"

[trailers.Supersedes.cli]
flag = "supersedes"

[trailers.Supersedes.prompt]
confirm = "Add a Supersedes reference?"
input = "Supersedes (8-char hex Lore-id):"
order = 180

[trailers.Depends-on]
description = "Lore-id of the atom this decision requires."
multivalue = true
validation = "reference"
crossProtocol = true
isCore = true
directives = [ "[on:commit] Run \"lore trace <id>\" to verify the target exists and is relevant" ]

[trailers.Depends-on.ui]
kind = "reference"
color = "dim"

[trailers.Depends-on.cli]
flag = "depends-on"

[trailers.Depends-on.prompt]
confirm = "Add a Depends-on reference?"
input = "Depends-on (8-char hex Lore-id):"
order = 190

[trailers.Depends-on.stale_if]
kind = "reference-superseded"

[trailers.Related]
description = "Lore-id of an atom with a general relationship."
multivalue = true
validation = "reference"
crossProtocol = true
isCore = true

[trailers.Related.ui]
kind = "reference"
color = "dim"

[trailers.Related.cli]
flag = "related"

[trailers.Related.prompt]
confirm = "Add a Related reference?"
input = "Related (8-char hex Lore-id):"
order = 200

[trailers.Related.stale_if]
kind = "reference-superseded"
